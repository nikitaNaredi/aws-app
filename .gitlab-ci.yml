stages:
  - test


docker-build-test:
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
  tags:
    - aws
    - prd
    - us-west-2
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker info
    - docker build -t aws-app:test .
    - docker run --rm aws-app:test
    